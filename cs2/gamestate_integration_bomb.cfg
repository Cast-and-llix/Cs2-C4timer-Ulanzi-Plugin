"CS2 Bomb Timer (Ulanzi D200)"
{
	// Where CS2 sends game state. Must match bomb_timer.py --host/--port.
	"uri"		"http://127.0.0.1:3000/"

	"timeout"	"5.0"
	"buffer"	"0.0"	// send immediately - the plant must not be delayed
	"throttle"	"0.1"
	"heartbeat"	"10.0"

	// Must match bomb_timer.py --token (default CS2BOMBTIMER)
	"auth"
	{
		"token"	"CS2BOMBTIMER"
	}

	"data"
	{
		"provider"		"1"
		"map"			"1"
		"round"			"1"	// round.bomb = planted / defused / exploded (works while playing)
		"player_id"		"1"
		"bomb"			"1"	// exact bomb state + countdown (spectator / GOTV only)
		"phase_countdowns"	"1"	// phase "bomb" countdown, used for resync when present
	}
}
